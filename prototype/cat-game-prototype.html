<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>貓咪找家 — 可玩介面原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "Arial Rounded MT Bold", "Noto Sans TC", system-ui, sans-serif;
      --ink: #202638;
      --muted: #687084;
      --paper: #f5f3ed;
      --line: #e1dfd7;
      --accent: #d85244;
      --accent-dark: #a9342a;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
    button, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid #236e9b; outline-offset: 2px; }
    .shell { min-height: 100vh; padding: 26px 24px 96px; }
    .app { max-width: 1120px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 18px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 850; letter-spacing: .14em; }
    h1 { margin: 5px 0 2px; font-size: clamp(25px, 4vw, 36px); letter-spacing: -.04em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .level-chip { flex: 0 0 auto; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); text-align: right; font-size: 12px; font-weight: 800; }
    .level-chip strong { color: var(--accent); font-size: 17px; }
    .meta-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 11px; }
    .meta-line b { color: var(--ink); }
    .game-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
    .board-card, .panel { min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 8px 26px #2426380a; }
    .board-card { padding: 18px; }
    .board-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px; }
    .board-heading h2 { margin: 0; font-size: 15px; }
    .board-heading span { color: var(--muted); font-size: 10px; text-align: right; }
    .board-wrap { width: min(100%, 610px); margin: 0 auto; }
    .board { display: grid; gap: 0; aspect-ratio: 1; overflow: hidden; padding: 3px; border: 1px solid #101729; border-radius: 12px; background: #101729; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .cell { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 0; overflow: hidden; border-style: solid; border-radius: 0; background-color: var(--region-color, #ddd); background-image: var(--region-pattern, none); color: #172033; font-size: clamp(15px, 4.5vw, 34px); line-height: 1; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .cell:hover { z-index: 1; filter: brightness(1.04); }
    .cell.cat { background-image: linear-gradient(#fff3, #fff3) !important; }
    .cat-symbol { filter: drop-shadow(0 1px 2px #fff); }
    .cell.cross-mark { z-index: 1; background: #b42332 !important; color: #fff; font-size: clamp(20px, 5vw, 38px); font-weight: 1000; text-shadow: 0 2px 2px #52101a; }
    .cell.cross-mark .mark-symbol { transform: scale(1.2); }
    .cell.fixed-clue { cursor: not-allowed; background: repeating-linear-gradient(135deg, #d8dee8 0 6px, #c7d0de 6px 9px) !important; color: #26364e; font-size: clamp(17px, 4vw, 30px); }
    .clue-tag { position: absolute; top: 2px; right: 3px; padding: 1px 3px; border: 1px solid #51637c; border-radius: 3px; background: #fff; color: #26364e; font-size: clamp(6px, 1vw, 8px); font-weight: 900; line-height: 1.2; }
    .cell.conflict { box-shadow: inset 0 0 0 3px #ffc400, inset 0 0 0 5px #202638; }
    .cell.hint-flash { animation: hint .65s ease-in-out 2; }
    @keyframes hint { 50% { box-shadow: inset 0 0 0 5px #f7bc35, 0 0 0 3px #cf7c12; } }
    .board-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 11px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .side { display: grid; gap: 11px; }
    .panel { padding: 15px; }
    .panel h3 { margin: 0 0 10px; font-size: 13px; }
    .rule-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; color: #50596d; font-size: 11px; }
    .rule-list li { display: flex; gap: 8px; align-items: baseline; }
    .rule-list b { width: 18px; color: var(--accent); font-size: 10px; }
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .btn { min-height: 40px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 850; }
    .btn:hover:not(:disabled) { border-color: #b7bac5; background: #faf9f6; }
    .btn.selected { border-color: #26364e; box-shadow: inset 0 0 0 1px #26364e; background: #eef1f5; }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn.primary:hover:not(:disabled) { border-color: var(--accent-dark); background: var(--accent-dark); }
    .btn:disabled { cursor: not-allowed; opacity: .48; }
    .button-stack { display: grid; gap: 7px; margin-top: 9px; }
    .feedback { min-height: 38px; margin: 10px 0 0; padding: 9px 10px; border-radius: 9px; background: #f3f4f6; color: #50596d; font-size: 11px; line-height: 1.45; }
    .feedback.good { background: #e6f3eb; color: #23664d; }
    .feedback.warn { background: #fff0e7; color: #8e3b2f; }
    .progress-track { height: 6px; margin: 9px 0 5px; overflow: hidden; border-radius: 99px; background: #e9e8e2; }
    .progress-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .progress-copy { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .select-row { display: flex; gap: 8px; align-items: center; }
    .select-row label { flex: 1; color: var(--muted); font-size: 10px; font-weight: 800; }
    select { display: block; width: 100%; margin-top: 4px; padding: 8px 7px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font-size: 11px; }
    .note { margin: 9px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .variant-bar { position: fixed; z-index: 10; left: 50%; bottom: 14px; display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid #ffffff35; border-radius: 999px; background: #232638; color: white; box-shadow: 0 8px 24px #13152255; transform: translateX(-50%); }
    .variant-bar button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #ffffff1b; color: #fff; font-size: 18px; }
    .variant-bar button:hover { background: #ffffff38; }
    .variant-label { min-width: 104px; text-align: center; font-size: 10px; font-weight: 850; }

    body[data-variant="starlight"] { background: #171a25; color: #f5f4f0; --paper: #171a25; --ink: #f5f4f0; --muted: #acb0bd; --line: #ffffff20; --card: #222633; --accent: #f0b858; --accent-dark: #c68b35; }
    body[data-variant="starlight"] .panel, body[data-variant="starlight"] .board-card { box-shadow: 0 14px 38px #0003; }
    body[data-variant="starlight"] .rule-list { color: #d3d5de; }
    body[data-variant="starlight"] .btn, body[data-variant="starlight"] select { border-color: #ffffff24; background: #2d3241; color: #fff; }
    body[data-variant="starlight"] .btn.selected { background: #42495a; }
    body[data-variant="starlight"] .btn.primary { border-color: var(--accent); background: var(--accent); color: #29261e; }
    body[data-variant="starlight"] .feedback { background: #303544; color: #e2e3e8; }
    body[data-variant="starlight"] .feedback.good { background: #214334; color: #c8f0d9; }
    body[data-variant="starlight"] .feedback.warn { background: #512f2b; color: #ffd6c5; }
    body[data-variant="starlight"] .progress-track { background: #3c4050; }
    body[data-variant="starlight"] .level-chip { background: #2d3241; }
    body[data-variant="starlight"] .level-chip strong { color: var(--accent); }

    body[data-variant="fieldnotes"] { background: #ece7dc; --paper: #ece7dc; --accent: #257765; --accent-dark: #1a5a4c; }
    body[data-variant="fieldnotes"] .topbar { align-items: flex-start; padding: 14px 16px; border: 1px solid #ddd6c9; border-radius: 14px; background: #fffdf8; }
    body[data-variant="fieldnotes"] .game-grid { grid-template-columns: 265px minmax(0, 1fr); }
    body[data-variant="fieldnotes"] .side { grid-column: 1; grid-row: 1; }
    body[data-variant="fieldnotes"] .board-area { grid-column: 2; grid-row: 1; }
    body[data-variant="fieldnotes"] .board-card { border-radius: 8px; box-shadow: 0 5px 20px #4b402311; }
    body[data-variant="fieldnotes"] .panel { border-radius: 8px; box-shadow: none; }
    body[data-variant="fieldnotes"] .board { border-radius: 6px; }

    body[data-variant="trail"] { background: #f2eee8; --paper: #f2eee8; --accent: #64509a; --accent-dark: #493979; }
    body[data-variant="trail"] .topbar { padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    body[data-variant="trail"] .game-grid { grid-template-columns: minmax(0, 1.12fr) minmax(290px, .88fr); }
    body[data-variant="trail"] .side { grid-template-columns: 1fr 1fr; align-items: start; }
    body[data-variant="trail"] .rules-panel, body[data-variant="trail"] .progress-panel { grid-column: 1 / -1; }
    body[data-variant="trail"] .board-card { padding: 14px; }
    body[data-variant="trail"] .panel { padding: 13px; }
    body[data-variant="trail"] .board { border-radius: 16px; }

    @media (max-width: 760px) {
      .shell { padding: 17px 13px 86px; }
      .game-grid, body[data-variant="fieldnotes"] .game-grid, body[data-variant="trail"] .game-grid { grid-template-columns: minmax(0, 1fr); }
      body[data-variant="fieldnotes"] .side, body[data-variant="fieldnotes"] .board-area { grid-column: auto; grid-row: auto; }
      body[data-variant="fieldnotes"] .board-area { grid-row: 1; }
      body[data-variant="fieldnotes"] .side { grid-row: 2; }
      body[data-variant="trail"] .side { grid-template-columns: 1fr 1fr; }
      .board-card { padding: 12px; }
      .topbar { align-items: flex-start; }
    }
    @media (max-width: 460px) {
      .topbar { gap: 8px; }
      .level-chip { padding: 8px; font-size: 10px; }
      .level-chip strong { font-size: 15px; }
      .meta-line { align-items: flex-start; font-size: 10px; }
      .board-heading { align-items: flex-start; }
      .board-heading span { max-width: 48%; }
      .board-footer { font-size: 9px; }
      body[data-variant="trail"] .side { grid-template-columns: 1fr; }
      body[data-variant="trail"] .rules-panel, body[data-variant="trail"] .progress-panel { grid-column: auto; }
      .variant-label { min-width: 90px; }
    }
  </style>

      }
      function currentDifficulty() {
        return state.mode === "campaign" ? difficultyFor(state.level) : { label: "隨機", hints: 1 };
      }
      function resetPuzzle(puzzle, solution, mode, level = 1) {
        state.puzzle = puzzle;
        state.solution = solution.slice();
        state.mode = mode;
        state.level = level;
        state.marks = new Map();
        state.tool = "cat";
        state.hintUses = 0;
        state.hintCell = null;
        state.won = false;
        state.drag = null;
        state.dragClickGuard = null;
        state.feedback = mode === "campaign"
          ? `第 ${level} 關開始。棋盤沒有預放貓，題目叉格不是你的標記。`
          : "隨機唯一解題目已準備好。";
        state.feedbackKind = "";
        render();
      }
      function playLevel(level) {
        if (level < 1 || level > state.unlocked) return;
        const item = campaign.levels[level - 1];
        if (!validCampaignLevel(item)) throw new Error(`第 ${level} 關資料驗證失敗。`);
        resetPuzzle({
          size: item.size,
          regions: item.regions,
          blocked_cells: item.blocked_cells,
          fixed_cats: item.fixed_cats
        }, item.solution, "campaign", level);
      }
      function currentBlocked() {
        return new Set(state.puzzle.blocked_cells.map(([r, c]) => key(r, c)));
      }
      function catCells() {
        return [...state.marks.entries()]
          .filter(([, value]) => value === "cat")
          .map(([cell]) => cell.split(",").map(Number));
      }
      function findConflicts() {
        const cats = catCells();
        const conflicts = new Set();
        for (let i = 0; i < cats.length; i++) {
          const [r1, c1] = cats[i];
          for (let j = i + 1; j < cats.length; j++) {
            const [r2, c2] = cats[j];
            const duplicateRegion = state.puzzle.regions[r1][c1] === state.puzzle.regions[r2][c2];
            if (r1 === r2 || c1 === c2 || duplicateRegion ||
                Math.max(Math.abs(r1 - r2), Math.abs(c1 - c2)) === 1) {
              conflicts.add(key(r1, c1));
              conflicts.add(key(r2, c2));
            }
          }
        }
        return conflicts;
      }
      function checkWin() {
        const cats = catCells();
        const columns = Array(state.puzzle.size).fill(-1);
        const rows = Array(state.puzzle.size).fill(0);
        for (const [row, column] of cats) {
          rows[row]++;
          columns[row] = column;
        }
        return cats.length === state.puzzle.size &&
          rows.every(count => count === 1) &&
          isValidSolution(state.puzzle.regions, columns, state.puzzle.blocked_cells) &&
          connectedRegions(state.puzzle.regions);
      }
      function setFeedback(text, kind = "") {
        state.feedback = text;
        state.feedbackKind = kind;
      }
      function handleWin() {
        if (state.won) return;
        state.won = true;
        if (state.mode === "campaign") {
          state.completed.add(state.level);
          state.unlocked = Math.max(state.unlocked, Math.min(campaign.levels.length, state.level + 1));
        }
        setFeedback(state.level === 100 && state.mode === "campaign"
          ? "太棒了！100 關全部完成；你可以重玩任何已解關卡。"
          : "答對了！所有列、欄、顏色區域各有一隻貓。", "good");
      }
      function placeMark(row, column) {
        const cell = key(row, column);
        if (currentBlocked().has(cell)) return;
        const current = state.marks.get(cell);
        if (state.tool === "cat") {
          if (current === "cat") state.marks.delete(cell);
          else state.marks.set(cell, "cat");
        } else {
          if (current === "cross") state.marks.delete(cell);
          else state.marks.set(cell, "cross");
        }
        state.hintCell = null;
        const conflicts = findConflicts();
        state.won = false;
        if (conflicts.size) setFeedback(`${conflicts.size} 格違反列、欄、區域或相鄰規則，已用黃框標出。`, "warn");
        else setFeedback("標記已更新。每個顏色區域都必須四方向連通，且只能放一隻貓。");
        if (checkWin()) handleWin();
        render();
      }
      function checkAnswer() {
        const cats = catCells();
        if (cats.length < state.puzzle.size) {
          setFeedback(`還需要 ${state.puzzle.size - cats.length} 隻貓；每列剛好一隻。`, "warn");
        } else if (checkWin()) {
          handleWin();
        } else {
          const conflicts = findConflicts();
          setFeedback(conflicts.size
            ? "有貓違反列、欄、顏色區域或八方向不相鄰規則，請看黃框。"
            : "目前每列有貓，但欄、區域或相鄰條件尚未全部符合。", "warn");
        }
        render();
      }
      function giveHint() {
        const allowance = currentDifficulty().hints;
        if (state.hintUses >= allowance) {
          setFeedback("這個難度的提示次數已用完。", "warn");
          render();
          return;
        }
        const row = state.solution.findIndex((column, r) => state.marks.get(key(r, column)) !== "cat");
        if (row < 0) {
          setFeedback("正確位置都已標出，按「檢查答案」確認。");
          render();
          return;
        }
        for (const [cell, mark] of state.marks) {
          if (mark === "cat" && Number(cell.split(",")[0]) === row) state.marks.delete(cell);
        }
        const cell = key(row, state.solution[row]);
        state.marks.set(cell, "cat");
        state.hintCell = cell;
        state.hintUses++;
        setFeedback(`提示：第 ${row + 1} 列的貓在第 ${state.solution[row] + 1} 欄。`);
        if (checkWin()) handleWin();
        render();
      }
      function nextLevel() {
        if (state.mode !== "campaign") {
          playLevel(state.unlocked);
        } else if (state.level < campaign.levels.length) {
          playLevel(state.level + 1);
        } else {
          playLevel(campaign.levels.length);
        }
      }
      function cellStyle(row, column, regionIndex) {
        const regions = state.puzzle.regions;
        const id = regions[row][column];
        const edge = (r, c) => r < 0 || c < 0 || r >= state.puzzle.size || c >= state.puzzle.size || regions[r][c] !== id;
        return `--region-color:${PALETTE[regionIndex % PALETTE.length]};--region-pattern:${PATTERNS[regionIndex % PATTERNS.length]};border-width:${edge(row - 1, column) ? 3 : 1}px ${edge(row, column + 1) ? 3 : 1}px ${edge(row + 1, column) ? 3 : 1}px ${edge(row, column - 1) ? 3 : 1}px;border-color:#182237`;
      }
      function boardMarkup() {
        const n = state.puzzle.size;
        const blocked = currentBlocked();
        const conflicts = findConflicts();
        let html = `<div class="board" role="grid" aria-label="${n} 乘 ${n} 貓咪棋盤" style="grid-template-columns:repeat(${n},minmax(0,1fr))">`;
        for (let row = 0; row < n; row++) {
          for (let column = 0; column < n; column++) {
            const cell = key(row, column);
            const clue = blocked.has(cell);
            const mark = state.marks.get(cell);
            const classes = ["cell"];
            if (mark === "cat") classes.push("cat");
            if (mark === "cross") classes.push("cross-mark");
            if (clue) classes.push("fixed-clue");
            if (conflicts.has(cell)) classes.push("conflict");
            if (state.hintCell === cell) classes.push("hint-flash");
            const symbol = mark === "cat" ? `<span class="cat-symbol">🐈‍⬛</span>` :
              clue ? `<span class="mark-symbol">×</span><span class="clue-tag">題目</span>` :
              mark === "cross" ? `<span class="mark-symbol">×</span>` : "";
            const label = `第 ${row + 1} 列，第 ${column + 1} 欄，${clue ? "題目提供的禁用格" : mark === "cat" ? "已標貓" : mark === "cross" ? "玩家排除" : "空格"}`;
            html += `<button type="button" class="${classes.join(" ")}" role="gridcell" aria-label="${label}" aria-pressed="${!!mark}" data-row="${row}" data-col="${column}" style="${cellStyle(row, column, Number(state.puzzle.regions[row][column].slice(1)) || 0)}">${symbol}</button>`;
          }
        }
        return html + "</div>";
      }
      function controlsMarkup() {
        const difficulty = currentDifficulty();
        const hintsLeft = Math.max(0, difficulty.hints - state.hintUses);
        const hintButton = difficulty.hints > 0
          ? `<button class="btn" data-action="hint" ${hintsLeft ? "" : "disabled"}>提示一隻 · ${hintsLeft} 次</button>`
          : `<button class="btn" disabled>挑戰關不提供提示</button>`;
        const nextLabel = state.mode === "campaign" && state.level === 100 ? "重玩第 100 關" : state.mode === "campaign" ? "下一關 →" : "再來一題 →";
        const nextButton = state.won ? `<button class="btn primary" data-action="next">${nextLabel}</button>` : "";
        const levelChoices = Array.from({ length: state.unlocked }, (_, index) => {
          const level = index + 1;
          const done = state.completed.has(level) ? " ✓" : "";
          return `<option value="${level}" ${state.mode === "campaign" && state.level === level ? "selected" : ""}>第 ${level} 關${done}</option>`;
        }).join("");
        const replay = state.mode === "campaign" && state.unlocked > 1
          ? `<div class="select-row"><label>重玩已解關<select id="level-select">${levelChoices}</select></label></div>` : "";
        return `<section class="panel"><h3>標記棋盤</h3>
          <div class="tools"><button class="btn ${state.tool === "cat" ? "selected" : ""}" data-tool="cat">🐈 放貓</button><button class="btn ${state.tool === "cross" ? "selected" : ""}" data-tool="cross">✕ 點格排除</button></div>
          <p class="note">桌面：左鍵按住滑過空格，直接標叉。觸控：點格放貓，先選「點格排除」再點叉。</p>
          <div class="button-stack">${hintButton}<button class="btn" data-action="check">✓ 檢查答案</button>${nextButton}<button class="btn" data-action="random">🎲 隨機唯一解題</button>${state.mode === "random" ? `<button class="btn" data-action="campaign">返回主線</button>` : ""}</div>
          <p class="feedback ${state.feedbackKind}" role="status">${state.feedback}</p>
          ${replay ? `<div style="margin-top:10px">${replay}</div>` : ""}</section>`;
      }
      function gameMarkup() {
        const puzzle = state.puzzle;
        const size = puzzle.size;
        const level = campaign.levels[state.level - 1];
        const difficulty = currentDifficulty();
        const cats = catCells().length;
        const blockedCount = puzzle.blocked_cells.length;
        const progress = Math.round(state.completed.size / campaign.levels.length * 100);
        const title = state.mode === "campaign" ? "貓咪找家" : "隨機挑戰";
        const description = state.mode === "campaign"
          ? "每列、每欄、每個相連顏色區域各一隻；貓不能八方向相鄰。"
          : "新生成的連通色區棋盤，已由瀏覽器求解器確認唯一解。";
        const score = state.mode === "campaign" ? level.solver_score : puzzle.proof.nodes;
        const scoreLabel = state.mode === "campaign" ? "solver 挑戰分數" : "求解節點";
        const scoreExplanation = state.mode === "campaign"
          ? `分數 = 10×完整 solver 節點 + 2×N − 題目叉 + 平均分支（${level.solver_profile.mean_branching}）。`
          : "此數字是隨機題完整唯一解搜尋的節點數。";
        const rules = `<section class="panel rules-panel"><h3>尋貓規則</h3><ul class="rule-list"><li><b>01</b><span>每一列恰好一隻貓</span></li><li><b>02</b><span>每一欄恰好一隻貓</span></li><li><b>03</b><span>每色恰有 ${size} 格、四方向連通且只放一隻貓</span></li><li><b>04</b><span>貓不能水平、垂直或斜對角相鄰</span></li></ul></section>`;
        const progressPanel = `<section class="panel progress-panel"><h3>${state.mode === "campaign" ? "100 關主線" : "本題"}</h3>
          <div class="progress-copy"><span>${state.mode === "campaign" ? `已解 ${state.completed.size} / 100 關` : "隨機題不計入主線"}</span><b>${state.mode === "campaign" ? `${progress}%` : `${cats} / ${size} 隻`}</b></div>
          <div class="progress-track"><i style="width:${state.mode === "campaign" ? progress : Math.round(cats / size * 100)}%"></i></div>
          <div class="progress-copy"><span>題目叉 ${blockedCount} 格</span><b>${scoreLabel} ${score}</b></div>
          <p class="note">${scoreExplanation} 這是成本代理，不等同人類體感難度。</p></section>`;
        return `<header class="topbar"><div><div class="eyebrow">CAT PUZZLE · PLAYABLE PROTOTYPE</div><h1>${title}</h1><p class="subtitle">${description}</p></div>
          <div class="level-chip">${state.mode === "campaign" ? `第 <strong>${state.level}</strong> / 100 關` : "隨機關卡"}<br>${size} × ${size} · ${difficulty.label}</div></header>
          <div class="meta-line"><span>盤面 <b>${cats}/${size}</b> 隻貓 · <b>${blockedCount}</b> 個題目禁用格</span><span>${scoreLabel} <b>${score}</b></span></div>
          <div class="game-grid"><section class="board-area board-card"><div class="board-heading"><h2>${state.mode === "campaign" ? `第 ${state.level} 關棋盤` : "隨機題目棋盤"}</h2><span>顏色與紋理區分區域 · 粗線為區域邊界</span></div>
          <div class="board-wrap">${boardMarkup()}</div><div class="board-footer"><span>題目灰叉是固定禁用格；紅叉是你的排除標記。</span><span>${cats} / ${size} 隻</span></div></section>
          <aside class="side">${controlsMarkup()}${progressPanel}${rules}</aside></div>`;
      }
      function markCell(row, column, mark) {
        const cell = key(row, column);
        if (currentBlocked().has(cell) || state.marks.has(cell)) return;
        state.marks.set(cell, mark);
        const button = app.querySelector(`.cell[data-row="${row}"][data-col="${column}"]`);
        if (button) {
          button.classList.add("cross-mark");
          button.setAttribute("aria-pressed", "true");
          button.setAttribute("aria-label", `第 ${row + 1} 列，第 ${column + 1} 欄，玩家排除`);
          button.innerHTML = `<span class="mark-symbol">×</span>`;
        }
      }
      function render() {
        document.body.dataset.variant = state.variant;
        app.innerHTML = gameMarkup();
        const variant = VARIANTS.find(item => item.id === state.variant);
        document.getElementById("variant-label").textContent = `${variant.mark} ${variant.label}`;
        const board = app.querySelector(".board");
        board.addEventListener("click", event => {
          const cell = event.target.closest(".cell");
          if (!cell) return;
          placeMark(Number(cell.dataset.row), Number(cell.dataset.col));
        });
        board.addEventListener("pointerdown", event => {
          if (event.button !== 0 || (event.pointerType !== "mouse" && event.pointerType !== "pen")) return;
          const cell = event.target.closest(".cell");
          if (!cell) return;
          const row = Number(cell.dataset.row), column = Number(cell.dataset.col);
          if (currentBlocked().has(key(row, column)) || state.marks.has(key(row, column))) return;
          state.drag = {
            pointerId: event.pointerId, start: [row, column], last: null, moved: false,
            lastPoint: [event.clientX, event.clientY]
          };
        });
        board.addEventListener("pointermove", event => {
          const drag = state.drag;
          if (!drag || event.pointerId !== drag.pointerId) return;
          const rect = board.getBoundingClientRect();
          const cellSize = rect.width / state.puzzle.size;
          const previous = drag.lastPoint || [event.clientX, event.clientY];
          const distance = Math.hypot(event.clientX - previous[0], event.clientY - previous[1]);
          const steps = Math.max(1, Math.ceil(distance / Math.max(2, cellSize * 0.35)));
          for (let step = 1; step <= steps; step++) {
            const x = previous[0] + (event.clientX - previous[0]) * step / steps;
            const y = previous[1] + (event.clientY - previous[1]) * step / steps;
            const target = document.elementFromPoint(x, y)?.closest(".cell");
            if (!target) continue;
            const row = Number(target.dataset.row), column = Number(target.dataset.col);
            if (row === drag.start[0] && column === drag.start[1]) continue;
            if (!drag.moved) {
              drag.moved = true;
              markCell(...drag.start, "cross");
            }
            if (currentBlocked().has(key(row, column)) || state.marks.has(key(row, column))) continue;
            if (drag.last !== key(row, column)) {
              markCell(row, column, "cross");
              drag.last = key(row, column);
            }
          }
          drag.lastPoint = [event.clientX, event.clientY];
          event.preventDefault();
        });
        board.addEventListener("pointerup", event => {
          const drag = state.drag;
          if (!drag || event.pointerId !== drag.pointerId) return;
          state.drag = null;
          if (drag.moved) {
            state.dragClickGuard = { cell: key(...drag.start), timeStamp: event.timeStamp };
            setFeedback("拖曳經過的空格已標成紅叉；原有貓、叉與題目禁用格不變。");
            setTimeout(() => {
              if (state.dragClickGuard?.timeStamp === event.timeStamp) state.dragClickGuard = null;
            }, 0);
          }
        });
        board.addEventListener("pointercancel", () => { state.drag = null; render(); });
        board.addEventListener("contextmenu", event => event.preventDefault());
        board.addEventListener("click", event => {
          const cell = event.target.closest(".cell");
          const guard = state.dragClickGuard;
          if (!cell || !guard) return;
          state.dragClickGuard = null;
          if (
            event.detail > 0 &&
            key(Number(cell.dataset.row), Number(cell.dataset.col)) === guard.cell &&
            event.timeStamp - guard.timeStamp < 50
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        app.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => {
          state.tool = button.dataset.tool;
          render();
        }));
        app.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => {
          const action = button.dataset.action;
          if (action === "check") checkAnswer();
          if (action === "hint") giveHint();
          if (action === "next") nextLevel();
          if (action === "random") {
            try {
              const puzzle = makeRandomPuzzle();
              resetPuzzle(puzzle, puzzle.solution, "random");
            } catch (error) {
              setFeedback(error.message, "warn");
              render();
            }
          }
          if (action === "campaign") playLevel(state.unlocked);
        }));
        app.querySelector("#level-select")?.addEventListener("change", event => playLevel(Number(event.target.value)));
      }
      function changeVariant(delta) {
        const index = VARIANTS.findIndex(item => item.id === state.variant);
        state.variant = VARIANTS[(index + delta + VARIANTS.length) % VARIANTS.length].id;
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        try { history.replaceState(null, "", url); } catch (_) { /* file:// may reject URL history updates */ }
        render();
      }
      document.getElementById("variant-prev").addEventListener("click", () => changeVariant(-1));
      document.getElementById("variant-next").addEventListener("click", () => changeVariant(1));
      document.addEventListener("keydown", event => {
        const target = event.target;
        if (target instanceof HTMLElement && (target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName))) return;
        if (event.key === "ArrowLeft") changeVariant(-1);
        if (event.key === "ArrowRight") changeVariant(1);
      });
      globalThis.CatPuzzlePrototype = {
        campaign,
        playLevel,
        state,
        classify,
        connectedRegions,
        makeRandomPuzzle,
        isValidSolution
      };
      playLevel(1);
    })();
  </script>
</body>
</html>
